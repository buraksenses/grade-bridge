name: Backend CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  build-test-sonar:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Sonar scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        run: dotnet restore GradeBridge.Backend.sln

      - name: Sonar begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"buraksenses_grade-bridge" \
            /o:"buraksenses" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io"

      - name: Build
        run: dotnet build GradeBridge.Backend.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GradeBridge.Backend.sln --configuration Release --no-build --logger trx

      - name: Sonar end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"
